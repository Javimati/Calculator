function XCF(){var v=GV('a'),fm=GV('b')||20000;if(!v)return;var t,s='';if(cU==='ms'){t=v/1000;s+='<span class="d">A segundos:</span>\n'+F(v)+' / 1000 = '+FS(t)+' s\n\n'}else if(cU==='m'){t=v/V0;s+='<span class="d">Distancia → tiempo:</span>\nt = '+F(v)+' / '+F(V0)+' = '+FS(t)+' s = '+F(t*1000,4)+' ms\n\n'}else t=v;

var rw=[],cy=0,ff=0;while(ff<=fm){var pk=cy*sp,z1=pk+f1,ca=pk+cn,z2=pk+f2;if(pk>fm)break;rw.push({c:cy+1,p:Math.round(pk),z:Math.round(z1),a:Math.round(ca),z2:Math.round(z2)});ff=pk+sp;cy++}
var tb='<table class="tb"><tr><th>Ciclo</th><th class="pk">+6 dB</th><th class="zr">0 dB</th><th class="ca">Cancela</th><th class="zr">0 dB</th></tr>';for(var i=0;i<rw.length;i++){var r=rw[i];function sh(v,c){return v<=fm?'<td class="'+c+'">'+v+'</td>':'<td class="'+c+'">—</td>'}tb+='<tr><td>'+r.c+'</td>'+sh(r.p,'pk')+sh(r.z,'zr')+sh(r.a,'ca')+sh(r.z2,'zr')+'</tr>'}tb+='</table>';
var cc=rw.filter(function(r){return r.a<=fm}).length;s+='\n<span class="d">Cancelaciones hasta '+F(fm,0)+' Hz: <span class="h">'+cc+'</span></span>';

var cv=document.getElementById('cc');if(!cv)return;var x=cv.getContext('2d'),W=cv.width,H=cv.height,pL=50,pR=20,pT=30,pB=40,gW=W-pL-pR,gH=H-pT-pB;x.fillStyle='#1c1c1e';x.fillRect(0,0,W,H);x.strokeStyle='#444';x.lineWidth=1;x.beginPath();x.moveTo(pL,pT);x.lineTo(pL,pT+gH);x.lineTo(pL+gW,pT+gH);x.stroke();function yP(db){return pT+gH*(1-(db+30)/36)}function xP(f){return pL+gW*(f/fm)}x.fillStyle='#8e8e93';x.font='11px -apple-system,sans-serif';x.textAlign='right';[6,0,-6,-12,-18,-24,-30].forEach(function(db){var y=yP(db);x.fillText(db,pL-6,y+4);x.strokeStyle=db===0?'#666':'#333';x.beginPath();x.moveTo(pL,y);x.lineTo(pL+gW,y);x.stroke()});x.textAlign='center';var xs=fm<=5000?500:fm<=10000?1000:2000;for(var f=0;f<=fm;f+=xs){var px=xP(f);x.fillStyle='#8e8e93';x.fillText(f>=1000?(f/1000)+'k':f,px,pT+gH+18)}x.strokeStyle='#ff9f0a';x.lineWidth=2;x.beginPath();for(var i=0;i<=800;i++){var f=fm*i/800,ph=2*Math.PI*f*t,a=2*Math.cos(ph/2),db=a>.001?20*Math.log10(a):-30;if(db<-30)db=-30;var px=xP(f),py=yP(db);i===0?x.moveTo(px,py):x.lineTo(px,py)}x.stroke();x.fillStyle='#fff';x.font='bold 13px -apple-system,sans-serif';x.textAlign='center';x.fillText('Comb filter, retardo '+F(t*1000,2)+' ms',W/2,18)}

function XPW(){var se=GV('a'),sp=GV('b'),dd=GV('c');if(!se||isNaN(sp)||!dd)return;var ld=20*Math.log10(1/dd),s1=sp-ld,dp=s1-se,w=Math.pow(10,dp/10);var s='<span class="d">Pérdida por distancia:</span>\n20 × log(1 / '+F(dd,0)+') = <span class="h">'+F(ld,2)+' dB</span>\n\n<span class="d">SPL necesario a 1 m:</span>\n'+F(sp,0)+' + '+F(Math.abs(ld),2)+' = <span class="h">'+F(s1,2)+' dB SPL</span>\n\n<span class="d">Aporta la potencia:</span>\n'+F(s1,2)+' − '+F(se,0)+' = <span class="h">'+F(dp,2)+' dB</span>\n\n<span class="d">Potencia:</span>\n1 × 10^('+F(dp,2)+' / 10) = <span class="h">'+FS(w)+' W</span>';if(w>=1000)s+=' ≈ '+F(w/1000,2)+' kW';s+='\n\n<span class="d">Headroom:</span>\n+3 dB → '+FS(w*2)+' W\n+6 dB → '+FS(w*4)+' W\n+10 dB → '+FS(w*10)+' W';SR(s,FS(w)+' W')}

function XPH(){var f=GV('a'),tv=GV('b');if(!f||isNaN(tv))return;var t=fU==='ms'?tv/1000:tv,ph=360*f*t,s='';if(fU==='ms')s+='<span class="d">A segundos:</span>\n'+F(tv)+' ms / 1000 = '+FS(t)+' s\n\n';s+='<span class="d">Desfase:</span>\nφ = 360 × f × t\nφ = 360 × '+F(f,0)+' × '+FS(t)+' = <span class="h">'+F(ph,2)+'°</span>\n\n';var fc=Math.floor(ph/360),rm=ph-fc*360;if(ph>360)s+='<span class="d">Ciclos:</span>\n'+F(ph,2)+' / 360 = '+F(ph/360,2)+'\nCompletos: '+fc+' → Resto: '+F(ph/360-fc,2)+' × 360 = <span class="h">'+F(rm,2)+'°</span>\n\n';var ep=ph>360?rm:ph,cr=Math.cos(ep*Math.PI/360),am=2*cr,db;if(Math.abs(am)<1e-10)db=-Infinity;else db=20*Math.log10(Math.abs(am));s+='<span class="d">Nivel:</span>\n20 × log(2 × cos('+F(ep,2)+'° / 2))\n= 20 × log(2 × cos('+F(ep/2,2)+'°))\n= 20 × log(2 × '+F(cr,4)+')\n= 20 × log('+F(am,4)+')\n';if(isFinite(db))s+='= <span class="h">'+F(db,2)+' dB</span>';else s+='= <span style="color:#ff3b30">−∞ dB (cancelación total)</span>';s+='\n\n<span class="d">Interpretación:</span>\n';if(ep<10||ep>350)s+='En fase → <span class="h">≈ +6 dB</span>';else if(ep<120)s+='Fase parcial → <span class="h">+'+F(db,2)+' dB</span>';else if(Math.abs(ep-120)<5||Math.abs(ep-240)<5)s+='Frontera → <span class="h">0 dB</span>';else if(Math.abs(ep-180)<5)s+='Contrafase → <span style="color:#ff3b30">cancelación</span>';else if(ep>120&&ep<240)s+='Cancelación parcial → <span style="color:#ff3b30">'+F(db,2)+' dB</span>';else s+='Suma parcial → <span class="h">'+F(db,2)+' dB</span>';SR(s,isFinite(db)?F(ep,2)+'° → '+F(db,2)+' dB':F(ep,2)+'° → Cancelación')}
