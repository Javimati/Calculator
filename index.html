<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calculadora">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Calculadora</title>
<link rel="apple-touch-icon" href="icon.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',sans-serif;color:#fff}

/* ===== CALCULATOR (Portrait/Basic) ===== */
#calc{display:flex;flex-direction:column;height:100dvh;padding:env(safe-area-inset-top,0) 16px env(safe-area-inset-bottom,0);position:relative}
#top-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 0;flex-shrink:0}
.top-icon{width:44px;height:44px;border-radius:50%;background:#2a2a2a;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .1s}
.top-icon svg{width:22px;height:22px}
.top-icon:active{background:#444;transform:scale(0.92)}

#display-area{flex:1;display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-end;padding:0 8px 8px 0;min-height:60px;overflow:hidden}
#deg-indicator{display:none;font-size:15px;color:#8e8e93;align-self:flex-start;padding:4px 0}
#prev-expr{font-size:22px;font-weight:400;color:#8e8e93;text-align:right;line-height:1.1;white-space:nowrap;min-height:0;opacity:0;transition:opacity 0.2s;max-width:100%;overflow:hidden}
#prev-expr.show{opacity:1}
#display{font-size:88px;font-weight:300;text-align:right;line-height:1;letter-spacing:-2px;white-space:nowrap;max-width:100%;overflow:hidden}

/* Basic button grid */
.btn-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding-bottom:12px;flex-shrink:0}
.btn{display:flex;align-items:center;justify-content:center;border-radius:50%;aspect-ratio:1;font-size:30px;font-weight:400;border:none;outline:none;cursor:pointer;-webkit-appearance:none;transition:background-color .2s ease-out}
.btn:active{opacity:1}
.btn-num{background:#333;color:#fff}
.btn-op{background:#ff9f0a;color:#fff;font-size:34px}
.btn-fn{background:#a5a5a5;color:#000;font-size:22px}
.btn-op.hi{background:#fff;color:#ff9f0a}
.btn-fn svg{width:24px;height:24px;fill:none;stroke:#000;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ===== SCIENTIFIC MODE ===== */
body.sci #calc{padding:env(safe-area-inset-top,0) 6px env(safe-area-inset-bottom,0)}
body.sci #display-area{flex:0 0 auto;min-height:0;padding:0 8px 2px 0;justify-content:flex-end}
body.sci #deg-indicator{display:block;padding:2px 0}
body.sci #display{font-size:56px}
body.sci #prev-expr{font-size:16px}
body.sci .btn-grid{gap:6px;padding-bottom:6px;flex:1;grid-auto-rows:1fr}
body.sci .btn{border-radius:14px;aspect-ratio:auto;font-size:22px;padding:0;height:100%;align-self:stretch}
body.sci .btn-op{font-size:26px}
body.sci .btn-fn{font-size:16px}

.sci-grid{display:none;grid-template-columns:repeat(6,1fr);gap:4px;padding-bottom:4px;flex-shrink:0}
body.sci .sci-grid{display:grid;flex:1;grid-auto-rows:1fr}
.sci-btn{display:flex;align-items:center;justify-content:center;background:#333;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:500;padding:0;cursor:pointer;min-height:0;height:100%;-webkit-appearance:none;transition:background-color .2s ease-out}
.sci-btn:active{opacity:1}
.sci-btn.active-2nd{background:#555;color:#fff}
.sci-btn.mem-active{color:#ff9f0a}

/* Científica en horizontal: funciones a la izquierda, teclado a la derecha */
@media (orientation:landscape){
body.sci #calc{display:grid;grid-template-columns:6fr 4fr;grid-template-rows:auto auto minmax(0,1fr);column-gap:8px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
body.sci #top-bar{grid-column:1/3;padding:4px 0 0}
body.sci .top-icon{width:34px;height:34px}
body.sci .top-icon svg{width:18px;height:18px}
body.sci #display-area{grid-column:1/3;flex-direction:row;align-items:flex-end;justify-content:space-between;padding:0 4px 4px}
body.sci #deg-indicator{align-self:flex-end;padding:0 0 8px}
body.sci #display{font-size:44px;flex:1}
body.sci .sci-grid{grid-column:1;grid-row:3;gap:6px;padding-bottom:6px}
body.sci .btn-grid{grid-column:2;grid-row:3}
body.sci .sci-btn{border-radius:12px;font-size:15px}
body.sci #mode-dropdown{top:44px}
body.sci #prev-expr{position:absolute;top:12px;right:60px;left:60px;max-width:none;font-size:15px!important}
}

/* ===== HISTORY SHEET ===== */
#history-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:100;transition:opacity .3s;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#history-overlay.show{display:flex;flex-direction:column;justify-content:flex-end}
#history-sheet{background:rgba(28,28,30,.92);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);border-radius:16px 16px 0 0;max-height:65dvh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s ease-out;padding-bottom:env(safe-area-inset-bottom,0)}
#history-overlay.show #history-sheet{transform:translateY(0)}
#hist-handle{width:36px;height:5px;background:#666;border-radius:3px;margin:8px auto}
#hist-top{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 8px}
#hist-edit{color:#fff;font-size:17px;background:none;border:none;cursor:pointer;font-family:inherit}
#hist-close{width:30px;height:30px;border-radius:50%;background:#ff3b30;border:none;color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer}
#hist-list{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 24px;flex:1}
.hist-section{font-size:13px;color:#8e8e93;padding:16px 0 8px;font-weight:600}
.hist-entry{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.hist-expr{font-size:13px;color:#8e8e93;margin-bottom:4px}
.hist-result{font-size:20px;font-weight:700;color:#fff}
.hist-empty{color:#8e8e93;text-align:center;padding:40px 0;font-size:15px}

/* ===== AV TOOLS ===== */
#av{display:none;flex-direction:column;height:100dvh;background:#000;overflow:hidden;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
#av-h{display:flex;align-items:center;padding:8px 16px 10px;gap:12px;flex-shrink:0}
#av-h button{width:36px;height:36px;border-radius:50%;border:none;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#avb{background:#333}
#avx{background:#ff3b30}
#avt{font-size:17px;font-weight:600;flex:1}
#avc{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 24px}
.mn{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mb{background:#1c1c1e;border:none;border-radius:16px;padding:18px 12px;color:#fff;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:5px}
.mb:active{background:#2c2c2e}
.mi{font-size:26px}.ml{font-size:13px;font-weight:600}.md{font-size:10px;color:#8e8e93;line-height:1.3}
.af{display:flex;flex-direction:column;gap:12px}
.al{font-size:12px;color:#8e8e93;text-transform:uppercase;letter-spacing:.5px}
.ai{background:#1c1c1e;border:1px solid #333;border-radius:12px;padding:14px 16px;color:#fff;font-size:17px;font-family:inherit;width:100%;outline:none;-webkit-appearance:none}
.ai:focus{border-color:#ff9f0a}
.as{background:#1c1c1e;border:1px solid #333;border-radius:12px;padding:14px 16px;color:#fff;font-size:17px;font-family:inherit;width:100%;outline:none;-webkit-appearance:none}
.ab{background:#ff9f0a;border:none;border-radius:12px;padding:16px;color:#fff;font-size:17px;font-weight:600;cursor:pointer;width:100%;margin-top:4px}
.ab:active{opacity:.7}
.ar{background:#1c1c1e;border-radius:16px;padding:16px;margin-top:12px;overflow-x:auto}
.at{font-size:14px;line-height:1.7;color:#e5e5e7;font-family:'SF Mono',ui-monospace,monospace;white-space:pre-wrap;word-break:break-word}
.at .h{color:#ff9f0a;font-weight:600}.at .d{color:#8e8e93}
.af2{font-size:20px;font-weight:700;color:#30d158;margin-top:12px;padding:12px 16px;background:#0a3a1a;border-radius:12px;text-align:center}
.tb{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px}
.tb th{background:#2c2c2e;padding:8px 4px;text-align:center;font-weight:600;position:sticky;top:0}
.tb td{padding:5px 4px;text-align:center;border-bottom:1px solid #222}
.pk{color:#ff9f0a}.ca{color:#ff3b30}.zr{color:#8e8e93}
#cc{width:100%;height:250px;background:#1c1c1e;border-radius:12px;margin-top:12px}
.rg{display:flex;gap:0;border-radius:10px;overflow:hidden;background:#1c1c1e}
.rd{flex:1;padding:10px 6px;text-align:center;font-size:13px;color:#8e8e93;cursor:pointer;border:none;background:transparent}
.rd.on{background:#ff9f0a;color:#fff;font-weight:600}
input,select,textarea{-webkit-user-select:text;user-select:text}
.iw{display:flex;gap:8px;align-items:stretch}
.iw .ai{flex:1;min-width:0}
.sg{flex:0 0 54px;border-radius:12px;border:1px solid #333;background:#1c1c1e;color:#ff9f0a;font-size:22px;cursor:pointer;font-family:inherit}
.sg:active{background:#2c2c2e}
#cc{height:auto;aspect-ratio:8/3}

/* ===== MODE DROPDOWN ===== */
#mode-dropdown{display:none;position:absolute;top:56px;right:16px;background:rgba(50,50,52,.85);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);border-radius:14px;z-index:200;min-width:280px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.55);transform-origin:top right;animation:dropIn .15s ease-out}
@keyframes dropIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
#mode-dropdown .mode-opt{display:flex;align-items:center;gap:12px;padding:14px 16px;color:#fff;font-size:17px;font-family:inherit;background:none;border:none;width:100%;cursor:pointer;-webkit-appearance:none;min-height:50px}
#mode-dropdown .mode-opt:active{background:rgba(255,255,255,.1)}
#mode-dropdown .mode-sep{border-top:1px solid rgba(255,255,255,.1)}
.mode-check{width:22px;text-align:center;font-size:17px;font-weight:600;color:#fff;flex-shrink:0}
.mode-icon{width:28px;text-align:center;font-size:18px;flex-shrink:0;color:#8e8e93}
.mode-label{flex:1;text-align:left}
#mode-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:199}

/* ===== TOAST ===== */
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(50,50,52,.9);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#fff;padding:10px 24px;border-radius:20px;font-size:15px;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}

/* ===== Estilo redondeado (cápsulas) ===== */
:root{--rh:clamp(34px,5.3dvh,48px);--edge:inset 0 1px 0 rgba(255,255,255,.13),inset 0 0 0 1px rgba(255,255,255,.07)}
.btn,.sci-btn{box-shadow:var(--edge)}
.btn-num{background:#2a2a2c}
.btn-fn{background:#5b5b5e;color:#fff}
.btn-fn svg{stroke:#fff}
.btn-op{background:#f39a36}
.btn-op.hi{background:#fff;color:#f39a36}
.top-icon{background:#1c1c1e;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.top-icon svg{stroke:#fff}
.top-icon svg rect{fill:#fff}
.sci-btn{background:#1c1c1e;border-radius:999px;font-size:17px;font-weight:400}
.sci-btn.active-2nd{background:#5b5b5e}
.sci-btn .lb{display:inline-block;white-space:nowrap;line-height:1.2}
.sci-btn sup{font-size:.62em;line-height:0;position:relative;top:-.55em;vertical-align:baseline}
.sci-btn sub{font-size:.62em;line-height:0;position:relative;top:.3em;vertical-align:baseline}
.sci-btn .ov{text-decoration:overline}
body.sci .btn{border-radius:999px}
@media (orientation:portrait){
body.sci #calc{padding-left:14px;padding-right:14px}
body.sci #display-area{flex:1 1 auto;min-height:56px;padding:0 4px 10px 0}
body.sci #deg-indicator{align-self:flex-start;margin-bottom:auto;order:-1}
body.sci .sci-grid{flex:0 0 auto;grid-auto-rows:var(--rh);gap:8px 7px;padding-bottom:8px}
body.sci .btn-grid{flex:0 0 auto;grid-auto-rows:var(--rh);gap:8px 7px;padding-bottom:12px}
body.sci .btn{height:auto;font-size:24px}
body.sci .op-ic{width:24px;height:24px;stroke-width:2.4}
body.sci .btn-fn{font-size:20px}
}
@media (orientation:landscape){
body.sci .sci-btn{border-radius:999px;font-size:15px}
}

/* ===== Expresión estilo iOS ===== */
#display .o,#prev-expr .o{color:#8e8e93}
#display .g{color:#5a5a5e}
#display sup,#prev-expr sup{font-size:.6em;line-height:0;position:relative;top:-.62em;vertical-align:baseline}
#display sub,#prev-expr sub{font-size:.6em;line-height:0;position:relative;top:.25em;vertical-align:baseline}
#display i,#prev-expr i{font-family:'Times New Roman',Times,serif;font-style:italic}
#display{overflow:visible;padding-top:.3em}
#display-area{position:relative}
.btn-op{background:#ff9500}
.btn-op.hi{background:#fff;color:#ff9500}
.top-icon{width:38px;height:38px}
.top-icon svg{width:19px;height:19px}
@media (orientation:portrait){
body.sci #deg-indicator{position:absolute;left:2px;bottom:14px;margin:0;padding:0;font-size:11px}
}

/* ===== Clon del diseño de referencia (medido sobre la captura, 430 pt de ancho) ===== */
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--u:min(1vw,5px)}
#calc{padding:var(--sat) calc(var(--u)*3.72) calc(var(--sab) + 28px);max-width:500px;margin:0 auto}
body.sci #calc{max-width:none}
#top-bar{padding:0 4px}
.top-icon{width:44px;height:44px;background:#141414;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.top-icon:active{background:#3a3a3c}
.top-icon svg{width:28px;height:28px;stroke:#f4f4f4}
.top-icon svg.calc-ic{stroke:none}
.top-icon svg.calc-ic .cb{fill:#f4f4f4}
.top-icon svg.calc-ic .cd rect,.top-icon svg.calc-ic .cd circle{fill:#141414}
#display-area{padding:0 3px calc(var(--u)*2.6) 0}
#display{font-weight:400;letter-spacing:-.5px}
.btn-grid{gap:calc(var(--u)*1.93);padding-bottom:0}
.btn{aspect-ratio:258/248;border-radius:50%;font-size:calc(var(--u)*9.3);font-weight:400;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 0 1px rgba(255,255,255,.08)}
.btn,.sci-btn{color:#f5f5f5}
.btn-num{background:linear-gradient(180deg,#353535,#313131)}
.btn-fn{background:linear-gradient(180deg,#606060,#595959);color:#f5f5f5;font-size:calc(var(--u)*9.3)}
.btn-op{background:linear-gradient(180deg,#f29a38,#e98f33);color:#fefaf2;font-size:calc(var(--u)*12);font-weight:300}
.btn-op.hi{background:#fff;color:#f09a37}
.btn-fn svg{width:calc(var(--u)*9.4);height:auto;stroke:#f5f5f5;stroke-width:2;fill:none}
.btn[data-fn="sign"]{font-size:calc(var(--u)*10.5)}
.btn[data-fn="pct"]{font-size:calc(var(--u)*10.5);font-weight:300}
.op-ic{width:calc(var(--u)*10.2);height:calc(var(--u)*10.2);pointer-events:none;stroke-width:2.3}
.btn svg{pointer-events:none}
.sci-btn{background:linear-gradient(180deg,#222224,#1a1a1c)}
.sci-btn.active-2nd{background:#5b5b5e}
@media (orientation:portrait){
body.sci #calc{padding:var(--sat) 14px calc(var(--sab) + 28px)}
body.sci .btn-grid{padding-bottom:0}
body.sci .btn{aspect-ratio:auto;border-radius:999px;font-size:24px}
body.sci .op-ic{width:26px;height:26px;stroke-width:2.4}
body.sci .btn-fn{font-size:21px}
body.sci .btn-fn svg{width:26px}
}
@media (orientation:landscape){
body.sci #calc{padding-top:var(--sat);padding-bottom:max(8px,var(--sab))}
body.sci .btn{aspect-ratio:auto;border-radius:999px;font-size:22px}
body.sci .op-ic{width:24px;height:24px;stroke-width:2.4}
body.sci .btn-fn{font-size:19px}
body.sci .btn-fn svg{width:24px}
body.sci .top-icon{width:34px;height:34px}
body.sci .top-icon svg{width:22px;height:22px}
}
/* App en pantalla de inicio (iOS): la ventana mide menos que la pantalla y deja un hueco abajo */

/* ===== Clon de la científica en vertical (medido sobre la referencia) ===== */
.sci-btn{background:linear-gradient(180deg,#1b1b1b,#181818);color:#f4f4f4;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),inset 0 0 0 1px rgba(255,255,255,.07)}
.sci-btn i{font-family:'Times New Roman',Times,serif;font-style:italic;font-size:1.12em}
.sci-btn .rt{height:1.4em;width:1.57em;display:block;overflow:visible}
.sci-btn .rt text{fill:currentColor;stroke:none;font-family:inherit}
.sci-btn .rt path{fill:none;stroke:currentColor;stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round}
.sci-btn .fr sup{font-size:.7em;top:-.32em}
.sci-btn .fr sub{font-size:.7em;top:.14em}
body.sci .btn-num{background:linear-gradient(180deg,#2b2b2b,#272727)}
body.sci .btn-fn{background:linear-gradient(180deg,#585858,#515151)}
@media (orientation:portrait){
body.sci #calc{padding:var(--sat) calc(var(--u)*3.72) calc(var(--sab) + 28px);max-width:500px}
body.sci #display-area{padding:0 3px calc(var(--u)*3.1) 0}
body.sci .sci-grid{flex:0 0 auto;grid-auto-rows:calc(var(--u)*10.93);gap:calc(var(--u)*2.1) calc(var(--u)*1.93);padding-bottom:calc(var(--u)*2.1)}
body.sci .btn-grid{flex:0 0 auto;grid-auto-rows:calc(var(--u)*10.93);gap:calc(var(--u)*2.1) calc(var(--u)*1.93);padding-bottom:0}
body.sci .sci-btn{font-size:calc(var(--u)*4.05)}
body.sci .btn{font-size:calc(var(--u)*5.05)}
body.sci .btn-fn{font-size:calc(var(--u)*5.05)}
body.sci .btn[data-fn="pct"]{font-size:calc(var(--u)*5.9)}
body.sci .btn[data-fn="sign"]{font-size:calc(var(--u)*5.7)}
body.sci .btn-fn svg{width:calc(var(--u)*5.5)}
body.sci .op-ic{width:calc(var(--u)*5.9);height:calc(var(--u)*5.9);stroke-width:2.25}
body.sci #deg-indicator{bottom:calc(var(--u)*3.1 + 6px)}
}
/* App en pantalla de inicio (iOS): altura fija igual a la pantalla */
html.sa-fix,html.sa-fix body,html.sa-fix #calc,html.sa-fix #av{height:var(--app-h)}
</style>
</head>
<body>
<!-- CALCULATOR -->
<div id="calc">
<div id="top-bar">
<button class="top-icon" id="hist-btn" aria-label="Historial"><svg viewBox="0 0 28 28" fill="none" stroke="#f4f4f4" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="14" r="9.9"/><path d="M14 7.9V14H8.4"/></svg></button>
<button class="top-icon" id="mode-btn" aria-label="Modo"><svg class="calc-ic" viewBox="0 0 28 28"><rect class="cb" x="6" y="2.7" width="16" height="22.6" rx="3.2"/><g class="cd"><rect x="8.1" y="4.7" width="11.8" height="5" rx="1.5"/><circle cx="9.8" cy="13.4" r="1.5"/><circle cx="14" cy="13.4" r="1.5"/><circle cx="18.2" cy="13.4" r="1.5"/><circle cx="9.8" cy="17.6" r="1.5"/><circle cx="14" cy="17.6" r="1.5"/><circle cx="18.2" cy="17.6" r="1.5"/><circle cx="9.8" cy="21.8" r="1.5"/><circle cx="14" cy="21.8" r="1.5"/><circle cx="18.2" cy="21.8" r="1.5"/></g></svg></button>
</div>
<div id="mode-overlay" onclick="closeModeDropdown()"></div>
<div id="mode-dropdown">
<button class="mode-opt" onclick="selectMode('basic')"><span class="mode-check" id="chk-basic">✓</span><span class="mode-icon">±÷</span><span class="mode-label">Básica</span></button>

<script>
// =============================================
// CALCULADORA - motor de expresiones
// =============================================
var tokens = [];        // {type:'num'|'op'|'paren', value, disp, typed}
var cur = '0';          // numero actual (cadena)
var entering = false;   // el usuario esta tecleando digitos
var hasVal = false;     // cur es un operando valido (tecleado o calculado)
var justEvald = false;  // cur viene de pulsar =
var curDisp = null;     // HTML con el que se muestra cur (sin(9), 8², π...) o null
var curPct = false;     // cur lleva % detrás
var curTyped = false;   // cur se estaba tecleando antes de añadirle %
var lastOp = null, lastNum = null;
var isScientific = false, is2nd = false, isDeg = true;
var memory = 0, memHasValue = false;
var openParens = 0;
var calcHistory = [];
var ERRS = {'Maths error': 1, 'Overflow': 1, 'Error': 1};
var SPECIAL = {'^': 1, 'yx': 1, 'ee': 1, 'yroot': 1, 'logbase': 1};

var $disp = document.getElementById('display');
var $prevExpr = document.getElementById('prev-expr');
var $acb = document.getElementById('acb');
var $degInd = document.getElementById('deg-indicator');

// --- Toast ---
var toastTimer = null;
function showToast(msg) {
  closeModeDropdown();
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { t.classList.remove('show'); }, 1500);
}

// --- Formato de numeros (es) ---
function sep(intStr) { return intStr.replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function fmtTyped(s) {
  var neg = s.charAt(0) === '-' ? '-' : '';
  if (neg) s = s.slice(1);
  var i = s.indexOf('.');
  if (i === -1) return neg + sep(s);
  return neg + sep(s.slice(0, i)) + ',' + s.slice(i + 1);
}
function fmtRes(n) {
  if (isNaN(n)) return 'Maths error';
  if (!isFinite(n)) return 'Overflow';
  if (n === 0) return '0';
  var a = Math.abs(n), neg = n < 0 ? '-' : '';
  if (a >= 1e14 || a < 1e-6) {
    var p = a.toExponential(9).split('e');
    var m = p[0].replace(/\.?0+$/, '');
    return neg + m.replace('.', ',') + 'e' + p[1].replace('+', '');
  }
  // 14 cifras significativas, como iOS
  var v = Number(a.toPrecision(14));
  var s = v.toFixed(Math.min(20, Math.max(0, 13 - Math.floor(Math.log10(v)))));
  if (s.indexOf('.') !== -1) s = s.replace(/\.?0+$/, '');
  var parts = s.split('.');
  return neg + sep(parts[0]) + (parts[1] ? ',' + parts[1] : '');
}
function isErr() { return hasVal && ERRS[cur] === 1; }
function fmtCur() {
  if (ERRS[cur] === 1) return cur;
  var h = curDisp !== null ? curDisp : (entering ? fmtTyped(cur) : fmtRes(parseFloat(cur)));
  return curPct ? h + '%' : h;
}
function norm(r) {
  if (isNaN(r)) return NaN;
  if (!isFinite(r)) return Infinity;
  return Number(r.toPrecision(15));
}

// --- Pantalla ---
function dispOp(o) {
  if (o === '+') return '<span class="o">+</span>';
  if (o === '-') return '<span class="o">−</span>';
  if (o === '*') return '<span class="o">×</span>';
  if (o === '/') return '<span class="o">÷</span>';
  if (o === '^') return '^';
  if (o === 'ee') return 'e';
  if (o === 'yx') return ' y<sup>x</sup> ';
  if (o === 'yroot') return ' <sup>y</sup>√ ';
  if (o === 'logbase') return ' log<sub>y</sub> ';
  return o;
}
// Los negativos que no van al principio se muestran entre paréntesis: 996×(-63,5)
function wrapNeg(h, first) { return (!first && h.charAt(0) === '-') ? '(' + h + ')' : h; }
function plainText(h) {
  var d = document.createElement('div');
  d.innerHTML = String(h).replace(/<sup>(.*?)<\/sup>/g, '^$1');
  return d.textContent;
}
function tokensText(toks, tail) {
  var expr = '', sup = false;
  for (var i = 0; i < toks.length; i++) {
    var t = toks[i];
    if (t.type === 'num') {
      if (sup) { expr += '<sup>' + t.disp + '</sup>'; sup = false; }
      else expr += wrapNeg(t.disp, expr === '');
    } else if (t.type === 'op') {
      if (t.hidden) continue;
      if (t.value === '^') {
        var nx = toks[i + 1];
        if (nx ? nx.type === 'num' : true) { sup = true; continue; }
      }
      expr += dispOp(t.value);
    } else {
      if (sup) { expr += '^'; sup = false; }
      expr += t.value;
    }
  }
  if (tail != null) expr += sup ? '<sup>' + tail + '</sup>' : wrapNeg(tail, expr === '');
  else if (sup) expr += '<sup class="g">□</sup>';
  return expr;
}
function buildExpression() {
  var expr = tokensText(tokens, hasVal ? fmtCur() : null);
  for (var i = 0; i < openParens; i++) expr += '<span class="g">)</span>';
  return expr || '0';
}
function updateDisplay() {
  var html = buildExpression();
  $disp.innerHTML = html;
  // Tamaño: el máximo del modo, reducido lo justo para que quepa en el ancho
  var base = isScientific ? (wasLandscape ? 44 : Math.min(60, window.innerWidth * 0.126)) : Math.min(82, window.innerWidth * 0.167);
  $disp.style.fontSize = base + 'px';
  var avail = $disp.parentElement.clientWidth - 12 - ((isScientific && !isDeg) ? 30 : 0), w = $disp.scrollWidth;
  if (w > avail && w > 0) $disp.style.fontSize = Math.max(16, Math.floor(base * avail / w * 10) / 10) + 'px';
  // Expresión anterior encima del resultado (solo mientras se muestra un resultado de =)
  if (!justEvald) { $prevExpr.classList.remove('show'); $prevExpr.innerHTML = ''; }
  else if ($prevExpr.textContent) {
    var mainSize = parseFloat(window.getComputedStyle($disp).fontSize) || 88;
    $prevExpr.style.fontSize = Math.max(15, Math.min(26, mainSize * 0.42)) + 'px';
    $prevExpr.classList.add('show');
  }
  $acb.textContent = (tokens.length > 0 || (hasVal && !justEvald)) ? 'C' : 'AC';
  $degInd.textContent = 'Rad';
  $degInd.style.visibility = isDeg ? 'hidden' : 'visible';
}

// --- Utilidades de tokens ---
function lastTok() { return tokens.length ? tokens[tokens.length - 1] : null; }
function isP(t, v) { return !!t && t.type === 'paren' && t.value === v; }
function numTok(v, d, typed, pct) { return {type: 'num', value: v, disp: d, typed: !!typed, pct: !!pct}; }
function pushCur() {
  var v = cur;
  if (entering) {
    if (v.charAt(v.length - 1) === '.') v = v.slice(0, -1);
    if (v === '-0' || v === '' || v === '-') v = '0';
    cur = v;
  }
  tokens.push(numTok(v, fmtCur(), entering && curDisp === null && !curPct, curPct));
  curDisp = null; curPct = false;
}
function allClear() {
  cur = '0'; tokens = []; entering = false; hasVal = false; justEvald = false;
  curDisp = null; curPct = false;
  lastOp = null; lastNum = null; openParens = 0;
}

// --- Entrada: digitos ---
function inputNum(n) {
  if (isErr()) allClear();
  var c = (n === ',') ? '.' : n;
  if (!entering) {
    if (hasVal) {
      if (justEvald) { tokens = []; openParens = 0; }
      else { pushCur(); tokens.push({type: 'op', value: '*'}); }   // sin(9)5 → sin(9)×5
    } else if (isP(lastTok(), ')')) {
      tokens.push({type: 'op', value: '*'});
    }
    cur = (c === '.') ? '0.' : c;
    curDisp = null; curPct = false;
    entering = true; hasVal = true;
  } else {
    if (c === '.') {
      if (cur.indexOf('.') !== -1) return;
      cur += '.';
    } else {
      if (cur.replace(/[-.]/g, '').length >= 15) return;
      if (cur === '0') cur = c;
      else if (cur === '-0') cur = '-' + c;
      else cur += c;
    }
  }
  justEvald = false;
  clearHighlight();
  updateDisplay();
}

// --- Entrada: operadores ---
function inputOp(o) {
  if (o === '=') { doEquals(); return; }
  if (isErr()) return;
  if (hasVal) {
    pushCur();
  } else {
    var l = lastTok();
    if (!l || isP(l, '(')) tokens.push(numTok('0', '0', false));
    else if (l.type === 'op') tokens.pop();
  }
  tokens.push({type: 'op', value: o});
  cur = '0'; hasVal = false; entering = false; justEvald = false; curDisp = null; curPct = false;
  lastOp = null; lastNum = null;
  highlightOp(o);
  updateDisplay();
}

function setResult(r, exprDisplay) {
  var s = isNaN(r) ? 'Maths error' : !isFinite(r) ? 'Overflow' : String(r);
  if (exprDisplay != null && ERRS[s] !== 1) addCalcHistory(plainText(exprDisplay), fmtRes(r), r);
  cur = s; tokens = []; openParens = 0; curDisp = null; curPct = false;
  entering = false; hasVal = true; justEvald = true;
  $prevExpr.innerHTML = exprDisplay || '';
  clearHighlight();
  updateDisplay();
}

function doEquals() {
  if (isErr()) return;
  if (tokens.length === 0) {
    if (!hasVal) return;
    if (curDisp !== null || curPct) {
      setResult(norm(curValue()), fmtCur());
    } else if (lastOp && lastNum !== null) {
      var a = parseFloat(cur);
      var ex = fmtCur() + dispOp(lastOp) + wrapNeg(fmtRes(lastNum), false);
      setResult(norm(applyOp(a, lastNum, lastOp)), ex);
    } else {
      cur = String(parseFloat(cur)); entering = false; justEvald = true; $prevExpr.innerHTML = '';
      updateDisplay();
    }
    return;
  }
  if (hasVal) {
    pushCur();
  } else {
    var l = lastTok();
    if (l.type === 'op') {
      var p = tokens[tokens.length - 2];
      if (l.value === '+' || l.value === '-' || l.value === '*' || l.value === '/') tokens.pop();   // √(9)+ = → 3
      else if (p && p.type === 'num') tokens.push(numTok(p.value, p.disp, p.typed, p.pct));
      else tokens.pop();
    } else if (isP(l, '(')) {
      tokens.push(numTok('0', '0', false));
    }
  }
  var n = tokens.length;
  if (n >= 2 && tokens[n - 1].type === 'num' && !tokens[n - 1].pct && tokens[n - 2].type === 'op' && !tokens[n - 2].hidden) {
    lastOp = tokens[n - 2].value; lastNum = parseFloat(tokens[n - 1].value);
  } else { lastOp = null; lastNum = null; }
  var exprDisplay = tokensText(tokens, null);
  for (var i = 0; i < openParens; i++) exprDisplay += ')';
  setResult(norm(evaluateTokens(tokens)), exprDisplay);
}

// --- Evaluador (descenso recursivo, precedencia correcta) ---
function applyOp(a, b, op) {
  if (op === '+') return a + b;
  if (op === '-') return a - b;
  if (op === '*') return a * b;
  if (op === '/') return b === 0 ? NaN : a / b;
  if (op === '^') return Math.pow(a, b);
  if (op === 'yx') return Math.pow(b, a);
  if (op === 'ee') return a * Math.pow(10, b);
  if (op === 'yroot') {
    if (b === 0) return NaN;
    if (a < 0 && Math.abs(b % 2) === 1) return -Math.pow(-a, 1 / b);
    return Math.pow(a, 1 / b);
  }
  if (op === 'logbase') return (a <= 0 || b <= 0 || b === 1) ? NaN : Math.log(a) / Math.log(b);
  return a;
}
function evaluateTokens(toks) {
  var t = toks.slice(), open = 0, i;
  for (i = 0; i < t.length; i++) if (t[i].type === 'paren') open += (t[i].value === '(') ? 1 : -1;
  while (open-- > 0) t.push({type: 'paren', value: ')'});
  var pos = 0;
  function isOp(set) { var k = t[pos]; return !!k && k.type === 'op' && set[k.value] === 1; }
  function atom() {
    var k = t[pos];
    if (!k) return 0;
    if (k.type === 'num') { pos++; return k.pct ? parseFloat(k.value) / 100 : parseFloat(k.value); }
    if (isP(k, '(')) {
      pos++;
      var v = expr();
      if (isP(t[pos], ')')) pos++;
      return v;
    }
    return 0;
  }
  function power() {
    var a = atom();
    if (isOp(SPECIAL)) { var o = t[pos++].value; return applyOp(a, power(), o); }
    return a;
  }
  function term() {
    var a = power();
    while (isOp({'*': 1, '/': 1})) { var o = t[pos++].value; a = applyOp(a, power(), o); }
    return a;
  }
  function expr() {
    var a = term();
    while (isOp({'+': 1, '-': 1})) {
      var o = t[pos++].value, k = t[pos], nx = t[pos + 1];
      // 200 + 10 %  →  el 10 % se calcula sobre lo anterior
      if (k && k.type === 'num' && k.pct && !(nx && nx.type === 'op' && nx.value !== '+' && nx.value !== '-')) { pos++; a = applyOp(a, a * parseFloat(k.value) / 100, o); }
      else a = applyOp(a, term(), o);
    }
    return a;
  }
  return expr();
}

// --- Funciones basicas ---
function inputFn(f) {
  if (f === 'ac') {
    allClear();
    clearHighlight(); updateDisplay();
    return;
  }
  if (f === 'sign') {
    if (isErr()) return;
    if (!hasVal) {
      if (isP(lastTok(), ')')) return;
      cur = '-0'; entering = true; hasVal = true; justEvald = false;
    } else if (entering) {
      cur = cur.charAt(0) === '-' ? cur.slice(1) : '-' + cur;
    } else {
      cur = String(-parseFloat(cur));
      if (curDisp !== null) curDisp = curDisp.charAt(0) === '-' ? curDisp.slice(1) : '-' + curDisp;
      justEvald = false;
    }
    updateDisplay();
    return;
  }
  if (f === 'pct') {
    if (isErr()) return;
    if (!hasVal) {
      if (!isP(lastTok(), ')')) return;
      cur = String(takeOperand()); curDisp = null; hasVal = true; entering = false;
    }
    if (curPct) return;
    if (entering) {
      if (cur.charAt(cur.length - 1) === '.') cur = cur.slice(0, -1);
      if (cur === '-0') cur = '0';
    }
    curTyped = entering;
    curPct = true; entering = false; justEvald = false;
    clearHighlight(); updateDisplay();
    return;
  }
  if (f === 'bs') {
    if (isErr()) { allClear(); updateDisplay(); return; }
    if (hasVal && curPct) {
      curPct = false; entering = curTyped && curDisp === null;
    } else if (entering) {
      cur = cur.slice(0, -1);
      if (cur === '' || cur === '-') {
        cur = '0';
        if (tokens.length > 0) { hasVal = false; entering = false; }
      }
    } else if (hasVal) {
      cur = '0'; curDisp = null; justEvald = false;
      if (tokens.length > 0) { hasVal = false; entering = false; } else entering = true;
    } else {
      var t = tokens.pop();
      if (t) {
        if (isP(t, '(')) openParens--;
        else if (isP(t, ')')) openParens++;
        else if (t.type === 'op') {
          var p = lastTok();
          if (p && p.type === 'num') {
            tokens.pop(); cur = p.value; hasVal = true;
            curPct = p.pct; curTyped = p.typed;
            var base = p.pct ? p.disp.replace(/%$/, '') : p.disp;
            curDisp = (p.typed || base === fmtRes(parseFloat(p.value))) ? null : base;
            entering = p.typed && !p.pct;
          }
        }
      }
      clearHighlight();
    }
    updateDisplay();
  }
}
// Coloca un valor calculado como operando actual
// Coloca el resultado de una función como operando actual, mostrado como expresión (sin(9), 8²...)
function applyValue(r, disp) {
  r = norm(r);
  cur = String(r); curDisp = (disp != null) ? disp : null; curPct = false;
  entering = false; hasVal = true; justEvald = false;
  clearHighlight();
  updateDisplay();
}
// Inserta una constante o un valor de memoria. sym: HTML simbólico (π, e) o null para un número
function setConst(v, sym) {
  if (isErr()) allClear();
  if (hasVal) {
    if (justEvald) { tokens = []; openParens = 0; }
    else { pushCur(); tokens.push({type: 'op', value: '*', hidden: !!sym}); }   // 8π  /  69×(-10)
  } else if (isP(lastTok(), ')')) {
    tokens.push({type: 'op', value: '*', hidden: !!sym});
  }
  cur = String(v); curDisp = sym || null; curPct = false;
  entering = false; hasVal = true; justEvald = false;
  clearHighlight();
  updateDisplay();
}
// Valor numérico del operando actual (teniendo en cuenta el %)
function curValue() {
  var n = parseFloat(cur);
  if (!curPct) return n;
  var l = lastTok();
  if (l && l.type === 'op' && !l.hidden && (l.value === '+' || l.value === '-')) {
    var start = 0, d = 0;
    for (var i = tokens.length - 1; i >= 0; i--) {
      if (isP(tokens[i], ')')) d++;
      else if (isP(tokens[i], '(')) { if (d === 0) { start = i + 1; break; } d--; }
    }
    return evaluateTokens(tokens.slice(start, tokens.length - 1)) * n / 100;
  }
  return n / 100;
}
// Operando para funciones de un argumento (numero actual o grupo entre parentesis)
// Operando para funciones de un argumento
function takeOperand() {
  if (hasVal) return curValue();
  var l = lastTok();
  if (isP(l, ')')) {
    var d = 0, i;
    for (i = tokens.length - 1; i >= 0; i--) {
      if (isP(tokens[i], ')')) d++;
      else if (isP(tokens[i], '(')) d--;
      if (d === 0) break;
    }
    if (i < 0) i = 0;
    return norm(evaluateTokens(tokens.splice(i)));
  }
  if (l && l.type === 'op') {
    var p = tokens[tokens.length - 2];
    if (p && p.type === 'num') return p.pct ? parseFloat(p.value) / 100 : parseFloat(p.value);
  }
  return 0;
}

// --- Resaltado de operador ---
function highlightOp(o) {
  document.querySelectorAll('.btn-op').forEach(function(b) {
    b.classList.toggle('hi', b.dataset.op === o && o !== '=');
  });
}
function clearHighlight() {
  document.querySelectorAll('.btn-op').forEach(function(b) { b.classList.remove('hi'); });
}

// --- Historial ---
function loadCalcHistory() {
  try { calcHistory = JSON.parse(localStorage.getItem('calcHistory') || '[]'); } catch(e) { calcHistory = []; }
  if (!Array.isArray(calcHistory)) calcHistory = [];

  var s = D('Pérdida por distancia:') + '\n20 × log(1 / ' + I(dd) + ') = ' + H(FD(ld) + ' dB') + '\n\n';
  s += D('SPL necesario a 1 m:') + '\n' + I(sp) + (ld <= 0 ? ' + ' + FD(-ld) : ' − ' + FD(ld)) + ' = ' + H(FD(s1) + ' dB SPL') + '\n\n';
  s += D('Lo que aporta la potencia:') + '\n' + FD(s1) + ' − ' + PR(I(se)) + ' = ' + H(FD(dp) + ' dB') + '\n\n';
  s += D('Potencia:') + '\n1 × 10^(' + FD(dp) + ' / 10) = ' + H(F(w) + ' W');
  if (w >= 1000) s += ' ≈ ' + F(w / 1000) + ' kW';
  s += '\n\n' + D('Headroom (cada +3 dB ≈ el doble de W):') + '\n+3 dB → ' + F(w * 2) + ' W\n+6 dB → ' + F(w * 4) + ' W\n+10 dB → ' + F(w * 10) + ' W';
  if (F(wx) !== F(w)) s += '\n\n' + D('Sin redondear los pasos intermedios (P = d² × 10^((SPL − Sens) / 10)): ' + F(wx) + ' W');
  SR(s, F(w) + ' W');
}

// ---------- 6. Fase ----------
var fU = 'ms';
function M6() {
  AN('Fase', function() {
    fU = 'ms';
    _v.innerHTML = '<div class="af">' + LB('Frecuencia (Hz)') + IN('a') + LB('Tiempo de diferencia') + IN('b') + LB('Unidad') + '<div class="rg"><div class="rd on" onclick="RM(this);fU=\'ms\'">ms</div><div class="rd" onclick="RM(this);fU=\'s\'">s</div></div>' + BT('Calcular', 'XPH') + '<div id="R"></div></div>';
  });
}
function XPH() {
  var f = GV('a'), tv = GV('b');
  if (!(f > 0)) return ER('Escribe una frecuencia mayor que 0.');
  if (isNaN(tv) || tv < 0) return ER('Escribe un tiempo (0 o mayor).');
  var t = Number((fU === 'ms' ? tv / 1000 : tv).toPrecision(12)), ph = Number((360 * f * t).toPrecision(12)), s = '';
  if (fU === 'ms') s += D('A segundos:') + '\n' + I(tv) + ' ms / 1000 = ' + I(t) + ' s\n\n';
  s += D('Desfase:') + '\nφ = 360 × f × t\nφ = 360 × ' + I(f) + ' × ' + I(t) + ' = ' + H(F(ph) + '°') + '\n\n';
  var ep = ph;
  if (ph >= 360) {
    var cyc = ph / 360, fc = Math.floor(cyc + 1e-9);
    ep = ph - fc * 360; if (ep < 1e-6) ep = 0;
    s += D('Quitar ciclos completos:') + '\n' + F(ph) + ' / 360 = ' + F(cyc, 4) + '\n';
    if (ep === 0) s += fc + ' ciclos exactos → sobran ' + H('0°') + '\n\n';
    else s += 'Completos: ' + fc + ' → sobra ' + F(cyc - fc, 4) + ' × 360 = ' + H(F(ep) + '°') + '\n\n';
  }
  var c = Math.cos(ep * Math.PI / 360), db = LVL(ep);
  if (Math.abs(c) < 1e-9) c = 0;
  s += D('Nivel de la suma:') + '\n20 × log(2 × cos(' + F(ep) + '° / 2))\n= 20 × log(2 × cos(' + F(ep / 2) + '°))\n= 20 × log(2 × ' + PR(F(c, 4)) + ')\n';
  if (c < 0) s += D('(el signo − solo indica polaridad; para el nivel se usa el valor absoluto)') + '\n';
  if (isFinite(db)) s += '= 20 × log(' + F(Math.abs(2 * c), 4) + ')\n= ' + H(SGN(db) + ' dB');
  else s += '= 20 × log(0)\n= <span style="color:#ff453a">−∞ dB (cancelación total)</span>';
  s += '\n\n' + D('Interpretación:') + '\n';
  if (ep < 1 || ep > 359) s += 'En fase → ' + H('suma máxima, ≈ +6 dB');
  else if (Math.abs(ep - 180) < 1) s += 'Contrafase (180°) → <span style="color:#ff453a">cancelación</span>';
  else if (Math.abs(ep - 120) < 1 || Math.abs(ep - 240) < 1) s += 'Frontera → ' + H('≈ 0 dB (igual que una sola señal)');
  else if (ep < 120 || ep > 240) s += 'Suma parcial → ' + H(SGN(db) + ' dB') + (db > 3 ? ' (casi en fase)' : '');
  else s += 'Cancelación parcial → <span style="color:#ff453a">' + FD(db) + ' dB</span>';
  SR(s, isFinite(db) ? F(ep) + '° → ' + SGN(db) + ' dB' : F(ep) + '° → Cancelación');
}

// ---------- 7. Ley inversa ----------
function M7() {
  AN('Ley inversa', function() {
    _v.innerHTML = '<div class="af">' + LB('Nivel conocido (dB SPL)') + IN('a', {sg: 1}) + LB('Distancia conocida (m)') + IN('b', {val: '1'}) + LB('Distancia objetivo (m)') + IN('c') + BT('Calcular', 'XIV') + '<div id="R"></div></div>';
  });
}
function XIV() {
  var db = GV('a'), d1 = GV('b'), d2 = GV('c');
  if (isNaN(db)) return ER('Escribe el nivel conocido.');
  if (!(d1 > 0) || !(d2 > 0)) return ER('Las dos distancias tienen que ser mayores que 0.');
  var lg = Math.log10(d1 / d2), dl = 20 * lg, df = db + dl;
  var s = D('ΔL = 20 × log(d₁ / d₂)') + '\n= 20 × log(' + I(d1) + ' / ' + I(d2) + ')\n= 20 × ' + PR(F(lg, 4)) + '\n= ' + H(SGN(dl) + ' dB') + '\n\n';
  s += D('Nivel a ' + I(d2) + ' m:') + '\n' + I(db) + ' + ' + PR(FD(dl)) + ' = ' + H(FD(df) + ' dB SPL');
  var dup = Math.log2(d2 / d1);
  if (Math.abs(dup - Math.round(dup)) < 1e-9 && dup !== 0) s += '\n\n' + D('Comprobación rápida: ' + Math.abs(Math.round(dup)) + (dup > 0 ? ' duplicaciones' : ' divisiones a la mitad') + ' de distancia × 6 dB ≈ ' + SGN(-6 * Math.round(dup), 0) + ' dB');
  SR(s, FD(df) + ' dB SPL a ' + I(d2) + ' m');
}

// ---------- 8. Directividad ----------
var rU = 'm';
function M8() {
  AN('Directividad', function() {
    rU = 'm';
    _v.innerHTML = '<div class="af">' + LB('Tamaño fuente') + IN('a') + LB('Unidad') + '<div class="rg"><div class="rd on" onclick="RM(this);rU=\'m\'">m</div><div class="rd" onclick="RM(this);rU=\'cm\'">cm</div><div class="rd" onclick="RM(this);rU=\'mm\'">mm</div></div>' + LB('Frecuencia (Hz)') + IN('b') + LB('Temperatura ºC (opc, def 20)') + IN('c', {ph: '20', sg: 1}) + BT('Calcular', 'XDR') + '<div id="R"></div></div>';
  });
}
function XDR() {
  var sz = GV('a'), f = GV('b');
  if (!(sz > 0)) return ER('Escribe un tamaño mayor que 0.');
  if (!(f > 0)) return ER('Escribe una frecuencia mayor que 0.');
  var tp = TEMP('c'); if (!tp) return;
  var c = {m: 1, cm: 0.01, mm: 0.001}, sm = Number((sz * c[rU]).toPrecision(12)), l = tp.V / f, s = '';
  if (rU !== 'm') s += D('A metros:') + '\n' + I(sz) + ' ' + rU + ' = ' + I(sm) + ' m\n\n';
  s += tp.txt + D('λ = V / f') + '\nλ = ' + F(tp.V) + ' / ' + I(f) + ' = ' + H(F(l) + ' m') + '\n\n';
  var res;
  if (sm > l * (1 + 1e-9)) { res = 'Más directiva'; s += I(sm) + ' m > ' + F(l) + ' m → ' + H('Más directiva') + '\n' + D('(la fuente es mayor que la longitud de onda)'); }
  else if (sm < l * (1 - 1e-9)) { res = 'Menos directiva (omnidireccional)'; s += I(sm) + ' m < ' + F(l) + ' m → ' + H('Menos directiva (omnidireccional)') + '\n' + D('(la fuente es menor que la longitud de onda)'); }
  else { res = 'Límite: tamaño = λ'; s += I(sm) + ' m = ' + F(l) + ' m → ' + H('Justo en el límite') + '\n' + D('(por debajo de esta frecuencia, omnidireccional; por encima, directiva)'); }
  var fl = tp.V / sm;
  s += '\n\n' + D('Frecuencia límite (λ = tamaño):') + '\nf = V / tamaño = ' + F(tp.V) + ' / ' + I(sm) + ' = ' + H(F(fl, 0) + ' Hz') + '\n' + D('Por debajo → omnidireccional y la onda rodea (difracta) un objeto de ese tamaño');
  SR(s, res);
}
