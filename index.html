<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calculadora">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Calculadora</title>
<link rel="apple-touch-icon" href="icon.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',sans-serif;color:#fff}

/* ===== CALCULATOR (Portrait/Basic) ===== */
#calc{display:flex;flex-direction:column;height:100dvh;padding:env(safe-area-inset-top,0) 16px env(safe-area-inset-bottom,0);position:relative}
#top-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 0;flex-shrink:0}
.top-icon{width:44px;height:44px;border-radius:50%;background:#2a2a2a;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .1s}
.top-icon svg{width:22px;height:22px}
.top-icon:active{background:#444;transform:scale(0.92)}

#display-area{flex:1;display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-end;padding:0 8px 8px 0;min-height:60px;overflow:hidden}
#deg-indicator{display:none;font-size:15px;color:#8e8e93;align-self:flex-start;padding:4px 0}
#display{font-size:88px;font-weight:300;text-align:right;line-height:1;letter-spacing:-2px;white-space:nowrap;max-width:100%;overflow:hidden}

/* Basic button grid */
.btn-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding-bottom:12px;flex-shrink:0}
.btn{display:flex;align-items:center;justify-content:center;border-radius:50%;aspect-ratio:1;font-size:30px;font-weight:400;border:none;outline:none;cursor:pointer;-webkit-appearance:none;transition:background-color .2s ease-out}
.btn:active{opacity:1}
.btn-num{background:#333;color:#fff}
.btn-op{background:#ff9f0a;color:#fff;font-size:34px}
.btn-fn{background:#a5a5a5;color:#000;font-size:22px}
.btn-op.hi{background:#fff;color:#ff9f0a}
.btn-fn svg{width:24px;height:24px;fill:none;stroke:#000;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ===== SCIENTIFIC MODE ===== */
body.sci #calc{padding:env(safe-area-inset-top,0) 6px env(safe-area-inset-bottom,0)}
body.sci #display-area{flex:0 0 auto;min-height:0;padding:0 8px 2px 0;justify-content:flex-end}
body.sci #deg-indicator{display:block;padding:2px 0}
body.sci #display{font-size:56px}
body.sci .btn-grid{gap:6px;padding-bottom:6px;flex:1;grid-auto-rows:1fr}
body.sci .btn{border-radius:14px;aspect-ratio:auto;font-size:22px;padding:0;height:100%;align-self:stretch}
body.sci .btn-op{font-size:26px}
body.sci .btn-fn{font-size:16px}

.sci-grid{display:none;grid-template-columns:repeat(6,1fr);gap:4px;padding-bottom:4px;flex-shrink:0}
body.sci .sci-grid{display:grid;flex:1;grid-auto-rows:1fr}
.sci-btn{display:flex;align-items:center;justify-content:center;background:#333;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:500;padding:0;cursor:pointer;min-height:0;height:100%;-webkit-appearance:none;transition:background-color .2s ease-out}
.sci-btn:active{opacity:1}
.sci-btn.active-2nd{background:#555;color:#fff}
.sci-btn.mem-active{color:#ff9f0a}

/* ===== HISTORY SHEET ===== */
#history-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:100;transition:opacity .3s;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#history-overlay.show{display:flex;flex-direction:column;justify-content:flex-end}
#history-sheet{background:rgba(28,28,30,.92);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);border-radius:16px 16px 0 0;max-height:65dvh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s ease-out;padding-bottom:env(safe-area-inset-bottom,0)}
#history-overlay.show #history-sheet{transform:translateY(0)}
#hist-handle{width:36px;height:5px;background:#666;border-radius:3px;margin:8px auto}
#hist-top{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 8px}
#hist-edit{color:#fff;font-size:17px;background:none;border:none;cursor:pointer;font-family:inherit}
#hist-close{width:30px;height:30px;border-radius:50%;background:#ff3b30;border:none;color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer}
#hist-list{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 24px;flex:1}
.hist-section{font-size:13px;color:#8e8e93;padding:16px 0 8px;font-weight:600}
.hist-entry{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.hist-expr{font-size:13px;color:#8e8e93;margin-bottom:4px}
.hist-result{font-size:20px;font-weight:700;color:#fff}
.hist-empty{color:#8e8e93;text-align:center;padding:40px 0;font-size:15px}

/* ===== AV TOOLS ===== */
#av{display:none;flex-direction:column;height:100dvh;background:#000;overflow:hidden;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
#av-h{display:flex;align-items:center;padding:8px 16px 10px;gap:12px;flex-shrink:0}
#av-h button{width:36px;height:36px;border-radius:50%;border:none;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#avb{background:#333}
#avx{background:#ff3b30}
#avt{font-size:17px;font-weight:600;flex:1}
#avc{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 24px}
.mn{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mb{background:#1c1c1e;border:none;border-radius:16px;padding:18px 12px;color:#fff;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:5px}
.mb:active{background:#2c2c2e}
.mi{font-size:26px}.ml{font-size:13px;font-weight:600}.md{font-size:10px;color:#8e8e93;line-height:1.3}
.af{display:flex;flex-direction:column;gap:12px}
.al{font-size:12px;color:#8e8e93;text-transform:uppercase;letter-spacing:.5px}
.ai{background:#1c1c1e;border:1px solid #333;border-radius:12px;padding:14px 16px;color:#fff;font-size:17px;font-family:inherit;width:100%;outline:none;-webkit-appearance:none}
.ai:focus{border-color:#ff9f0a}
.as{background:#1c1c1e;border:1px solid #333;border-radius:12px;padding:14px 16px;color:#fff;font-size:17px;font-family:inherit;width:100%;outline:none;-webkit-appearance:none}
.ab{background:#ff9f0a;border:none;border-radius:12px;padding:16px;color:#fff;font-size:17px;font-weight:600;cursor:pointer;width:100%;margin-top:4px}
.ab:active{opacity:.7}
.ar{background:#1c1c1e;border-radius:16px;padding:16px;margin-top:12px;overflow-x:auto}
.at{font-size:14px;line-height:1.7;color:#e5e5e7;font-family:'SF Mono',ui-monospace,monospace;white-space:pre-wrap;word-break:break-word}
.at .h{color:#ff9f0a;font-weight:600}.at .d{color:#8e8e93}
.af2{font-size:20px;font-weight:700;color:#30d158;margin-top:12px;padding:12px 16px;background:#0a3a1a;border-radius:12px;text-align:center}
.tb{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px}
.tb th{background:#2c2c2e;padding:8px 4px;text-align:center;font-weight:600;position:sticky;top:0}
.tb td{padding:5px 4px;text-align:center;border-bottom:1px solid #222}
.pk{color:#ff9f0a}.ca{color:#ff3b30}.zr{color:#8e8e93}
#cc{width:100%;height:250px;background:#1c1c1e;border-radius:12px;margin-top:12px}
.rg{display:flex;gap:0;border-radius:10px;overflow:hidden;background:#1c1c1e}
.rd{flex:1;padding:10px 6px;text-align:center;font-size:13px;color:#8e8e93;cursor:pointer;border:none;background:transparent}
.rd.on{background:#ff9f0a;color:#fff;font-weight:600}

/* ===== MODE DROPDOWN ===== */
#mode-dropdown{display:none;position:absolute;top:56px;right:16px;background:rgba(50,50,52,.85);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);border-radius:14px;z-index:200;min-width:280px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.55);transform-origin:top right;animation:dropIn .15s ease-out}
@keyframes dropIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
#mode-dropdown .mode-opt{display:flex;align-items:center;gap:12px;padding:14px 16px;color:#fff;font-size:17px;font-family:inherit;background:none;border:none;width:100%;cursor:pointer;-webkit-appearance:none;min-height:50px}
#mode-dropdown .mode-opt:active{background:rgba(255,255,255,.1)}
#mode-dropdown .mode-sep{border-top:1px solid rgba(255,255,255,.1)}
.mode-check{width:22px;text-align:center;font-size:17px;font-weight:600;color:#fff;flex-shrink:0}
.mode-icon{width:28px;text-align:center;font-size:18px;flex-shrink:0;color:#8e8e93}
.mode-label{flex:1;text-align:left}
#mode-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:199}

/* ===== TOAST ===== */
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(50,50,52,.9);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#fff;padding:10px 24px;border-radius:20px;font-size:15px;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}
</style>
</head>
<body>
<!-- CALCULATOR -->
<div id="calc">
<div id="top-bar">
<button class="top-icon" id="hist-btn" aria-label="Historial"><svg viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></button>
<button class="top-icon" id="mode-btn" aria-label="Modo"><svg viewBox="0 0 22 22" fill="none"><rect x="2" y="2" width="18" height="4.5" rx="1.2" fill="#aaa"/><rect x="2" y="8.5" width="4.5" height="4.5" rx="1.2" fill="#aaa"/><rect x="8.75" y="8.5" width="4.5" height="4.5" rx="1.2" fill="#aaa"/><rect x="15.5" y="8.5" width="4.5" height="4.5" rx="1.2" fill="#aaa"/><rect x="2" y="15" width="4.5" height="4.5" rx="1.2" fill="#aaa"/><rect x="8.75" y="15" width="4.5" height="4.5" rx="1.2" fill="#aaa"/><rect x="15.5" y="15" width="4.5" height="4.5" rx="1.2" fill="#aaa"/></svg></button>
</div>
<div id="mode-overlay" onclick="closeModeDropdown()"></div>
<div id="mode-dropdown">
<button class="mode-opt" onclick="selectMode('basic')"><span class="mode-check" id="chk-basic">✓</span><span class="mode-icon">±÷</span><span class="mode-label">Básica</span></button>
<button class="mode-opt" onclick="selectMode('scientific')"><span class="mode-check" id="chk-sci"></span><span class="mode-icon" style="font-style:italic;font-size:16px">f(x)</span><span class="mode-label">Científica</span></button>
<button class="mode-opt mode-sep" onclick="showToast('No disponible')"><span class="mode-check"></span><span class="mode-icon">✎</span><span class="mode-label">Math Notes</span></button>
<button class="mode-opt mode-sep" onclick="showToast('No disponible')"><span class="mode-check"></span><span class="mode-icon">⇄</span><span class="mode-label">Convertir</span></button>
</div>
<div id="display-area">
<div id="deg-indicator">Rad</div>
<div id="display">0</div>
</div>
<!-- Scientific buttons (hidden in portrait) -->
<div class="sci-grid" id="sci-grid"></div>
<!-- Basic button grid -->
<div class="btn-grid" id="basic-grid">
<button class="btn btn-fn" data-fn="bs"><svg viewBox="0 0 24 24"><path d="M9 4l-6 8 6 8h13V4H9z"/><path d="M14 9l4 6M18 9l-4 6"/></svg></button>
<button class="btn btn-fn" id="acb" data-fn="ac">AC</button>
<button class="btn btn-fn" data-fn="pct">%</button>
<button class="btn btn-op" data-op="/">÷</button>
<button class="btn btn-num" data-num="7">7</button>
<button class="btn btn-num" data-num="8">8</button>
<button class="btn btn-num" data-num="9">9</button>
<button class="btn btn-op" data-op="*">×</button>
<button class="btn btn-num" data-num="4">4</button>
<button class="btn btn-num" data-num="5">5</button>
<button class="btn btn-num" data-num="6">6</button>
<button class="btn btn-op" data-op="-">−</button>
<button class="btn btn-num" data-num="1">1</button>
<button class="btn btn-num" data-num="2">2</button>
<button class="btn btn-num" data-num="3">3</button>
<button class="btn btn-op" data-op="+">+</button>
<button class="btn btn-num" data-fn="sign">⁺⁄₋</button>
<button class="btn btn-num" data-num="0">0</button>
<button class="btn btn-num" data-num=",">,</button>
<button class="btn btn-op" id="eq" data-op="=">=</button>
</div>
</div>

<!-- HISTORY OVERLAY -->
<div id="history-overlay">
<div id="history-sheet">
<div id="hist-handle"></div>
<div id="hist-top">
<button id="hist-edit">Editar</button>
<button id="hist-close">✕</button>
</div>
<div id="hist-list"></div>
</div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- AV TOOLS -->
<div id="av">
<div id="av-h"><button id="avb" onclick="AB()">‹</button><div id="avt">AV</div><button id="avx" onclick="AX()">✕</button></div>
<div id="avc"></div>
</div>

<script>
// =============================================
// iOS 18 CALCULATOR ENGINE - Full Expression
// =============================================

// --- State ---
var tokens = []; // Array of tokens: {type:'num'|'op'|'func'|'paren', value:string}
var currentNum = '0';
var freshNum = true;
var justEvald = false;
var lastOp = null, lastNum = null;
var activeOp = null;
var isScientific = false;
var is2nd = false;
var isDeg = false; // false=Rad, true=Deg
var memory = 0;
var memHasValue = false;
var openParens = 0;
var calcHistory = [];

// DOM
var $disp = document.getElementById('display');
var $acb = document.getElementById('acb');
var $degInd = document.getElementById('deg-indicator');

// --- Toast ---
var toastTimer = null;
function showToast(msg) {
  closeModeDropdown();
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { t.classList.remove('show'); }, 1500);
}

// --- Number Formatting (Spanish locale) ---
function fmtNum(s) {
  if (s === 'Error' || s === 'Maths error' || s === 'Overflow') return s;
  var n = parseFloat(s);
  if (isNaN(n)) return 'Maths error';
  if (!isFinite(n)) return 'Overflow';

  // If user is typing (has trailing dot or decimal digits being entered)
  if (s.indexOf('.') !== -1 && !justEvald) {
    var parts = s.split('.');
    var intP = parts[0].replace(/^-/, '');
    var neg = s.charAt(0) === '-' ? '−' : '';
    var formatted = intP.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    return neg + formatted + ',' + parts[1];
  }

  // For results or integers
  if (Math.abs(n) >= 1e12 || (Math.abs(n) < 1e-6 && n !== 0)) {
    var e = n.toExponential(6).replace(/\.?0+e/, 'e');
    return e.replace('.', ',').replace('e+', 'e');
  }
  var str = n.toPrecision(12).replace(/\.?0+$/, '');
  var parts = str.split('.');
  var intP = parts[0].replace(/^-/, '');
  var neg = n < 0 ? '−' : '';
  var formatted = intP.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  if (parts[1]) return neg + formatted + ',' + parts[1];
  return neg + formatted;
}

// --- Display Update ---
function updateDisplay() {
  var txt = buildExpression();

  // Auto-size font
  var len = txt.length;
  if (isScientific) {
    $disp.style.fontSize = len > 20 ? '24px' : len > 16 ? '28px' : len > 12 ? '34px' : len > 9 ? '42px' : len > 7 ? '50px' : '56px';
  } else {
    $disp.style.fontSize = len > 16 ? 'min(32px,8vw)' : len > 12 ? 'min(42px,10vw)' : len > 9 ? 'min(56px,13vw)' : len > 7 ? 'min(68px,15vw)' : 'min(88px,18vw)';
  }
  $disp.textContent = txt;

  // AC vs C
  $acb.textContent = (currentNum !== '0' && !freshNum) ? 'C' : 'AC';

  // Deg indicator
  $degInd.textContent = isDeg ? 'Deg' : 'Rad';
}

function buildExpression() {
  var expr = '';
  for (var i = 0; i < tokens.length; i++) {
    var t = tokens[i];
    if (t.type === 'num') expr += fmtNum(t.value);
    else if (t.type === 'op') expr += dispOp(t.value);
    else if (t.type === 'func') expr += t.value;
    else if (t.type === 'paren') expr += t.value;
  }
  if (!freshNum || tokens.length === 0 || justEvald) {
    expr += fmtNum(currentNum);
  }
  return expr || '0';
}

function dispOp(o) {
  if (o === '+') return '+';
  if (o === '-') return '−';
  if (o === '*') return '×';
  if (o === '/') return '÷';
  return o;
}

// --- Input: Number ---
function inputNum(n) {
  var c = (n === ',') ? '.' : n;
  if (c === '.' && currentNum.indexOf('.') !== -1) return;

  if (freshNum) {
    if (justEvald || (tokens.length > 0 && tokens[tokens.length - 1].type === 'num' && activeOp === null)) {
      tokens = [];
      openParens = 0;
    }
    // Implicit multiplication after close paren: (2+3)5 → (2+3)*5
    if (tokens.length > 0 && tokens[tokens.length - 1].type === 'paren' && tokens[tokens.length - 1].value === ')') {
      tokens.push({type: 'op', value: '*'});
    }
    currentNum = (c === '.') ? '0.' : c;
    freshNum = false;
  } else {
    if (currentNum === '0' && c !== '.') currentNum = c;
    else currentNum += c;
  }
  justEvald = false;
  clearHighlight();
  updateDisplay();
}

// --- Input: Operator ---
function inputOp(o) {
  if (o === '=') {
    doEquals();
    return;
  }

  justEvald = false;
  lastOp = null; lastNum = null;

  // Push current number and operator
  if (!freshNum) {
    tokens.push({type: 'num', value: currentNum});
  }
  // If last token is an operator, replace it
  if (tokens.length > 0 && tokens[tokens.length - 1].type === 'op') {
    tokens[tokens.length - 1].value = o;
  } else {
    tokens.push({type: 'op', value: o});
  }
  currentNum = '0';
  freshNum = true;
  activeOp = o;
  highlightOp(o);
  updateDisplay();
}

function doEquals() {
  if (tokens.length === 0 && freshNum && lastOp && lastNum !== null) {
    // Repeated =
    var cur = parseFloat(currentNum);
    var result = evalBinary(cur, lastNum, lastOp);
    addCalcHistory(fmtNum(String(cur)) + dispOp(lastOp) + fmtNum(String(lastNum)), fmtNum(String(result)));
    currentNum = String(result);
    tokens = [];
    freshNum = true;
    justEvald = true;
    clearHighlight();
    updateDisplay();
    return;
  }

  if (tokens.length === 0) return;

  var exprDisplay = buildExpression();
  if (!freshNum) {
    tokens.push({type: 'num', value: currentNum});
  }

  // Save last op and num for repeated =
  for (var i = tokens.length - 1; i >= 0; i--) {
    if (tokens[i].type === 'op') {
      lastOp = tokens[i].value;
      if (i + 1 < tokens.length && tokens[i + 1].type === 'num') {
        lastNum = parseFloat(tokens[i + 1].value);
      }
      break;
    }
  }

  var result = evaluateTokens(tokens);
  var resultStr = isNaN(result) ? 'Maths error' : !isFinite(result) ? 'Overflow' : String(result);
  addCalcHistory(exprDisplay, fmtNum(resultStr));
  currentNum = resultStr;
  tokens = [];
  openParens = 0;
  freshNum = true;
  justEvald = true;
  activeOp = null;
  clearHighlight();
  updateDisplay();
}

// --- Evaluate tokens with proper precedence (supports parentheses) ---
function evaluateTokens(toks) {
  // Auto-close any unclosed parentheses
  var open = 0;
  for (var i = 0; i < toks.length; i++) {
    if (toks[i].type === 'paren') {
      if (toks[i].value === '(') open++;
      else open--;
    }
  }
  while (open > 0) { toks.push({type: 'paren', value: ')'}); open--; }

  // Resolve parentheses from innermost out
  var maxIter = 200;
  while (maxIter-- > 0) {
    var lastOpen = -1, found = false;
    for (var i = 0; i < toks.length; i++) {
      if (toks[i].type === 'paren' && toks[i].value === '(') {
        lastOpen = i;
      } else if (toks[i].type === 'paren' && toks[i].value === ')' && lastOpen !== -1) {
        var inner = toks.slice(lastOpen + 1, i);
        var val = evalFlat(inner);
        var before = toks.slice(0, lastOpen);
        var after = toks.slice(i + 1);
        toks = before.concat([{type: 'num', value: String(val)}]).concat(after);
        found = true;
        break;
      }
    }
    if (!found) break;
  }

  return evalFlat(toks);
}

function evalFlat(toks) {
  var nums = [];
  var ops = [];
  for (var i = 0; i < toks.length; i++) {
    if (toks[i].type === 'num') nums.push(parseFloat(toks[i].value));
    else if (toks[i].type === 'op') ops.push(toks[i].value);
  }

  if (nums.length === 0) return 0;
  if (nums.length === 1) return nums[0];

  // Pass 1: special ops (^, yx, ee, yroot, logbase) right-to-left
  for (var i = ops.length - 1; i >= 0; i--) {
    var op = ops[i];
    if (op === '^') {
      nums[i] = Math.pow(nums[i], nums[i + 1]);
      nums.splice(i + 1, 1); ops.splice(i, 1);
    } else if (op === 'yx') {
      nums[i] = Math.pow(nums[i + 1], nums[i]);
      nums.splice(i + 1, 1); ops.splice(i, 1);
    } else if (op === 'ee') {
      nums[i] = nums[i] * Math.pow(10, nums[i + 1]);
      nums.splice(i + 1, 1); ops.splice(i, 1);
    } else if (op === 'yroot') {
      nums[i] = Math.pow(nums[i], 1 / nums[i + 1]);
      nums.splice(i + 1, 1); ops.splice(i, 1);
    } else if (op === 'logbase') {
      nums[i] = Math.log(nums[i]) / Math.log(nums[i + 1]);
      nums.splice(i + 1, 1); ops.splice(i, 1);
    }
  }
  if (nums.length === 1) return nums[0];

  // Pass 2: * and /
  var nums2 = [nums[0]];
  var ops2 = [];
  for (var i = 0; i < ops.length; i++) {
    if (ops[i] === '*' || ops[i] === '/') {
      var a = nums2.pop();
      nums2.push(evalBinary(a, nums[i + 1], ops[i]));
    } else {
      ops2.push(ops[i]);
      nums2.push(nums[i + 1]);
    }
  }

  // Pass 3: + and -
  var result = nums2[0];
  for (var i = 0; i < ops2.length; i++) {
    result = evalBinary(result, nums2[i + 1], ops2[i]);
  }

  if (isNaN(result)) return NaN;
  if (!isFinite(result)) return Infinity;
  return Math.round(result * 1e10) / 1e10;
}

function evalBinary(a, b, op) {
  var r;
  if (op === '+') r = a + b;
  else if (op === '-') r = a - b;
  else if (op === '*') r = a * b;
  else if (op === '/') r = (b === 0) ? NaN : a / b;
  else r = a;
  if (isNaN(r)) return NaN;
  return Math.round(r * 1e10) / 1e10;
}

function buildSciGrid() {

  var labels = is2nd ? sciLabels2nd : sciLabelsNormal;

function toggleScientific() {
  isScientific = !isScientific;
  document.body.classList.toggle('sci', isScientific);
  if (isScientific) buildSciGrid();

function doSci(action) {
  var n = parseFloat(currentNum);
  var result;

  switch (action) {
    case '2nd':
      is2nd = !is2nd;
      buildSciGrid();
      return;
    case 'Deg':
      isDeg = true;
      is2nd = !is2nd;
      buildSciGrid();
      updateDisplay();
      return;
    case 'Rad':
      isDeg = false;
      is2nd = !is2nd;
      buildSciGrid();
      updateDisplay();
      return;
    case '(':
      if (justEvald) { tokens = []; justEvald = false; }
      if (!freshNum) {
        tokens.push({type: 'num', value: currentNum});
        tokens.push({type: 'op', value: '*'});
      } else if (tokens.length > 0 && tokens[tokens.length - 1].type === 'paren' && tokens[tokens.length - 1].value === ')') {
        // Implicit multiplication: )(  → )*(
        tokens.push({type: 'op', value: '*'});
      }
      tokens.push({type: 'paren', value: '('});
      openParens++;
      currentNum = '0';
      freshNum = true;
      updateDisplay();
      return;
    case ')':
      if (openParens <= 0) return;
      if (!freshNum) tokens.push({type: 'num', value: currentNum});
      tokens.push({type: 'paren', value: ')'});
      openParens--;
      currentNum = '0';
      freshNum = true;
      updateDisplay();
      return;
    case 'mc': memory = 0; memHasValue = false; buildSciGrid(); return;
    case 'm+': memory += n; memHasValue = true; buildSciGrid(); return;
    case 'm-': memory -= n; memHasValue = true; buildSciGrid(); return;
    case 'mr':
      currentNum = String(memory);
      freshNum = true; justEvald = true;
      updateDisplay();
      return;
    case 'x2': result = n * n; break;
    case 'x3': result = n * n * n; break;
    case 'xy':
      if (!freshNum) tokens.push({type: 'num', value: currentNum});
      tokens.push({type: 'op', value: '^'});
      currentNum = '0'; freshNum = true; activeOp = '^';
      updateDisplay();
      return;
    case 'yx':
      if (!freshNum) tokens.push({type: 'num', value: currentNum});
      tokens.push({type: 'op', value: 'yx'});
      currentNum = '0'; freshNum = true;
      updateDisplay();
      return;
    case 'ex': result = Math.exp(n); break;
    case '10x': result = Math.pow(10, n); break;
    case '2x': result = Math.pow(2, n); break;
    case '1/x': result = n === 0 ? NaN : 1 / n; break;
    case 'sqrt2': result = n < 0 ? NaN : Math.sqrt(n); break;
    case 'sqrt3': result = Math.cbrt(n); break;
    case 'sqrty':
      if (!freshNum) tokens.push({type: 'num', value: currentNum});
      tokens.push({type: 'op', value: 'yroot'});
      currentNum = '0'; freshNum = true;
      updateDisplay();
      return;
    case 'ln': result = n <= 0 ? NaN : Math.log(n); break;
    case 'log10': result = n <= 0 ? NaN : Math.log10(n); break;
    case 'log2': result = n <= 0 ? NaN : Math.log2(n); break;
    case 'logy':
      if (!freshNum) tokens.push({type: 'num', value: currentNum});
      tokens.push({type: 'op', value: 'logbase'});
      currentNum = '0'; freshNum = true;
      updateDisplay();
      return;
    case 'x!': result = factorial(n); break;
    case 'sin': result = Math.sin(toAngle(n)); break;
    case 'cos': result = Math.cos(toAngle(n)); break;
    case 'tan': result = Math.tan(toAngle(n)); break;
    case 'asin': result = fromAngle(Math.asin(n)); break;
    case 'acos': result = fromAngle(Math.acos(n)); break;
    case 'atan': result = fromAngle(Math.atan(n)); break;
    case 'sinh': result = Math.sinh(n); break;
    case 'cosh': result = Math.cosh(n); break;
    case 'tanh': result = Math.tanh(n); break;
    case 'asinh': result = Math.asinh(n); break;
    case 'acosh': result = n < 1 ? NaN : Math.acosh(n); break;
    case 'atanh': result = Math.abs(n) >= 1 ? NaN : Math.atanh(n); break;
    case 'e':
      currentNum = String(Math.E);
      freshNum = true; justEvald = true;
      updateDisplay();
      return;
    case 'pi':
      currentNum = String(Math.PI);
      freshNum = true; justEvald = true;
      updateDisplay();
      return;
    case 'EE':
      if (!freshNum) tokens.push({type: 'num', value: currentNum});
      tokens.push({type: 'op', value: 'ee'});
      currentNum = '0'; freshNum = true;
      updateDisplay();
      return;
    case 'Rand':
      currentNum = String(Math.random());
      freshNum = true; justEvald = true;
      updateDisplay();
      return;
    default: return;
  }

  // Apply result
  if (isNaN(result)) {
    currentNum = 'Maths error'; tokens = [];
    freshNum = true; justEvald = true;
  } else if (!isFinite(result)) {
    currentNum = 'Overflow'; tokens = [];
    freshNum = true; justEvald = true;
  } else {
    currentNum = String(result);
    freshNum = true; justEvald = true;
  }
  updateDisplay();
}

function toAngle(n) { return isDeg ? n * Math.PI / 180 : n; }
function fromAngle(rad) { return isDeg ? rad * 180 / Math.PI : rad; }

function factorial(n) {
  if (n < 0 || n !== Math.floor(n)) return gamma(n + 1);
  if (n > 170) return Infinity;
  var r = 1;
  for (var i = 2; i <= n; i++) r *= i;
  return r;
}

function gamma(z) {
  if (z < 0.5) return Math.PI / (Math.sin(Math.PI * z) * gamma(1 - z));
  z -= 1;
  var g = 7;
  var c = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313,
    -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
  var x = c[0];
  for (var i = 1; i < g + 2; i++) x += c[i] / (z + i);
  var t = z + g + 0.5;
  return Math.sqrt(2 * Math.PI) * Math.pow(t, z + 0.5) * Math.exp(-t) * x;
}
